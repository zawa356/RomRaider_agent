name: Product v1 Windows Agent spool CI

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'src/main/java/net/neristal/rrbridge/product/v1/**'
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/product/v1/**'
      - 'scripts/test-product-v1-spool.sh'
      - '.github/workflows/product-v1-spool-ci.yml'
      - 'lib/test-dependencies.sha256'
  pull_request:
    paths:
      - 'src/main/java/net/neristal/rrbridge/product/v1/**'
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/product/v1/**'
      - 'scripts/test-product-v1-spool.sh'
      - '.github/workflows/product-v1-spool-ci.yml'
      - 'lib/test-dependencies.sha256'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-v1-spool-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  durability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache verified Maven Central test jars
        uses: actions/cache@v4
        with:
          path: |
            lib/sqlite-jdbc.jar
            lib/slf4j-api.jar
            lib/slf4j-nop.jar
          key: rrbridge-test-jars-${{ runner.os }}-${{ hashFiles('lib/test-dependencies.sha256') }}
      - name: Compile Java 8-compatible durable spool and test real SQLite
        shell: bash
        run: bash scripts/test-product-v1-spool.sh
      - name: Confirm no ECU/RomRaider jar required
        shell: bash
        run: |
          test ! -f lib/RomRaider.jar
          echo "Pure product-v1 spool CI: no vehicle or RomRaider dependencies"
