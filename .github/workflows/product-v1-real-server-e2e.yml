name: Product v1 REAL Server E2E (public Server, pinned SHA)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/java/net/neristal/rrbridge/product/v1/**'
      - 'src/test/java/net/neristal/rrbridge/product/v1/**'
      - 'scripts/test-product-v1-real-server.sh'
      - 'scripts/test-product-v1-real-server-guard.sh'
      - 'scripts/test-product-v1-spool.sh'
      - 'scripts/test-rlc2-*http*.py'
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/prototype/ingress/**'
      - '.github/workflows/product-v1-real-server-e2e.yml'
  push:
    branches: [main, 'feat/**', 'ci/**']
    paths:
      - 'src/main/java/net/neristal/rrbridge/product/v1/**'
      - 'src/test/java/net/neristal/rrbridge/product/v1/**'
      - 'scripts/test-product-v1-real-server.sh'
      - 'scripts/test-product-v1-real-server-guard.sh'
      - 'scripts/test-rlc2-*http*.py'
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/prototype/ingress/**'
      - '.github/workflows/product-v1-real-server-e2e.yml'

permissions:
  contents: read

jobs:
  real-server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # History: until 2026-10-21 both repositories were private; this job needed a repo-scoped read-token secret and,
    # without it, declared the E2E NOT RUN. Both repositories are public now: the Server is checked out read-only with the
    # job's default contents:read token and no secret. A failed checkout fails the job (no NOT RUN fallback).
    # The Server commit is pinned to the approved main verified on 2026-10-21; change SERVER_SHA only to a reviewed Server
    # commit (procedure: docs/handoff/public_ci_recovery_2026-10-21.md).
    env:
      SERVER_REPOSITORY: zawa356/RomRaiderServer
      SERVER_SHA: d8c7a2f3b96ba278d269074dc40cca7741b4155b
      DATABASE_URL: postgresql://romlogger:ci_disposable_agent_e2e@127.0.0.1:5432/romlogger_agent_e2e
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: romlogger
          POSTGRES_DB: romlogger_agent_e2e
          POSTGRES_PASSWORD: ci_disposable_agent_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U romlogger -d romlogger_agent_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unsafe real-Server E2E destinations
        run: bash scripts/test-product-v1-real-server-guard.sh
      - name: Check out the public Server at the pinned commit (read-only, no secret)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVER_REPOSITORY }}
          ref: ${{ env.SERVER_SHA }}
          path: .real-server-source
          persist-credentials: false
      - name: Prove the Server source is exactly the pinned commit
        run: |
          test "$(git -C .real-server-source rev-parse HEAD)" = "$SERVER_SHA"
          echo "Server source: $SERVER_REPOSITORY@$SERVER_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Server deps and Java SQLite test dependencies
        run: |
          python -m pip install -r .real-server-source/requirements.txt
          bash scripts/test-product-v1-spool.sh
      - name: REAL Agent→FastAPI→PostgreSQL profile/records/replay
        env:
          ROMLOGGER_SERVER_PATH: .real-server-source
          ROMLOGGER_E2E_DISPOSABLE: '1'
        run: |
          bash scripts/test-product-v1-real-server.sh
          echo "### Real Server E2E: PASS (disposable synthetic DB)" >> "$GITHUB_STEP_SUMMARY"
      - name: RLC2 admitted candidate REAL HTTP with test-only ACK
        env:
          ROMLOGGER_SERVER_PATH: .real-server-source
          ROMLOGGER_RLC2_PREVIEW_ENABLE: '1'
          ROMLOGGER_RLC2_HTTP_ENABLE: '1'
        run: |
          bash scripts/test-rlc2-preview.sh
          python scripts/test-rlc2-real-server-http-guard.py
          python scripts/test-rlc2-real-server-http.py
          echo "### RLC2 real HTTP: PASS (test ACK only; Agent ACK unchanged)" >> "$GITHUB_STEP_SUMMARY"
