name: Isolated ingress journal prototype CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'scripts/test-ingress-journal-prototype.sh'
      - 'scripts/test-windows-native-identity.sh'
      - 'scripts/test-ingress-sqlite-receipts.sh'
      - 'scripts/test-watermark-ledger.sh'
      - 'scripts/test-ingress-diagnostics.sh'
      - 'scripts/test-rlc2-preview.sh'
      - 'scripts/test-rlc2-preview-postgres.py'
      - 'scripts/test-rlc2-preview-postgres-guard.py'
      - 'scripts/requirements-preview-cp312.lock'
      - 'scripts/run-acceleration-tests.ps1'
      - 'lib/test-dependencies.sha256'
      - '.github/workflows/ingress-journal-prototype-ci.yml'
  pull_request:
    paths:
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'scripts/test-ingress-journal-prototype.sh'
      - 'scripts/test-windows-native-identity.sh'
      - 'scripts/test-ingress-sqlite-receipts.sh'
      - 'scripts/test-watermark-ledger.sh'
      - 'scripts/test-ingress-diagnostics.sh'
      - 'scripts/test-rlc2-preview.sh'
      - 'scripts/test-rlc2-preview-postgres.py'
      - 'scripts/test-rlc2-preview-postgres-guard.py'
      - 'scripts/requirements-preview-cp312.lock'
      - 'scripts/run-acceleration-tests.ps1'
      - 'lib/test-dependencies.sha256'
      - '.github/workflows/ingress-journal-prototype-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journal-proto-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  isolated-journal:
    name: Fsync journal recovery / quota / CRC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Hosted runners can create symlinks; a skipped symlink rejection must fail CI.
      ROMLOGGER_REQUIRE_SYMLINK_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java 8-compatible isolated ingress journal and run crash tests
        shell: bash
        run: bash scripts/test-ingress-journal-prototype.sh
      - name: Verify real SQLite ingress receipts and product regression
        shell: bash
        run: bash scripts/test-ingress-sqlite-receipts.sh
      - name: Compare Windows native identity (test-only JNA, NTFS)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/test-windows-native-identity.sh
      - name: Phase 3c-1 RLC2 highwater ledger with real SQLite (synthetic)
        shell: bash
        run: bash scripts/test-watermark-ledger.sh
      - name: Read-only Supervisor diagnostics with real SQLite
        shell: bash
        run: bash scripts/test-ingress-diagnostics.sh
      - name: Isolated RLC2 preview SQLite and separate-JVM CLI
        shell: bash
        run: bash scripts/test-rlc2-preview.sh
      - name: Assert no production RomRaider.jar is needed
        shell: bash
        run: test ! -f lib/RomRaider.jar
      - name: Reject tracked build artifacts and test-created source changes
        shell: bash
        run: |
          test -z "$(git ls-files -- build dist 'lib/*.jar' '*.class' '*.pyc')"
          git diff --exit-code

  windows-java8-x86-identity:
    name: Test-only native identity and bound READ (Zulu8 x86)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remember JDK17 x64 for the Windows batch
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "ROMLOGGER_TEST_JDK17=$env:JAVA_HOME"
      - name: Install isolated Zulu8 32bit runtime
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: x86
      - name: Run complete Windows batch with actual JDK17 x64 and Zulu8 32bit JVM
        shell: pwsh
        run: |
          ./scripts/run-acceleration-tests.ps1 -Jdk17 $env:ROMLOGGER_TEST_JDK17 -Java8x86 $env:JAVA_HOME

  isolated-preview-postgres:
    name: RLC2 quarantine PostgreSQL16 (no Server ACK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: romlogger_preview_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d romlogger_preview_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/romlogger_preview_e2e
      ROMLOGGER_RLC2_PREVIEW_ENABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unsafe preview destinations before database access
        run: python scripts/test-rlc2-preview-postgres-guard.py
      - name: Install pinned synthetic PostgreSQL driver
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-preview-cp312.lock
      - name: Generate validated native RLC2 preview in isolated SQLite
        run: |
          bash scripts/test-product-v1-spool.sh --deps-only
          bash scripts/test-rlc2-preview.sh
      - name: Verify private PostgreSQL schema replay, receipts, rollback and ACK refusal
        run: python scripts/test-rlc2-preview-postgres.py
