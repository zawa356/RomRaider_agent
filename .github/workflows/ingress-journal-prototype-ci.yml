name: Isolated ingress journal prototype CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'scripts/test-ingress-journal-prototype.sh'
      - 'scripts/test-windows-native-identity.sh'
      - 'scripts/test-ingress-sqlite-receipts.sh'
      - 'scripts/test-watermark-ledger.sh'
      - '.github/workflows/ingress-journal-prototype-ci.yml'
  pull_request:
    paths:
      - 'src/main/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'src/test/java/net/neristal/rrbridge/prototype/ingress/**'
      - 'scripts/test-ingress-journal-prototype.sh'
      - 'scripts/test-windows-native-identity.sh'
      - 'scripts/test-ingress-sqlite-receipts.sh'
      - 'scripts/test-watermark-ledger.sh'
      - '.github/workflows/ingress-journal-prototype-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journal-proto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-journal:
    name: Fsync journal recovery / quota / CRC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Hosted runners can create symlinks; a skipped symlink rejection must fail CI.
      ROMLOGGER_REQUIRE_SYMLINK_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java 8-compatible isolated ingress journal and run crash tests
        shell: bash
        run: bash scripts/test-ingress-journal-prototype.sh
      - name: Verify real SQLite ingress receipts and product regression
        shell: bash
        run: bash scripts/test-ingress-sqlite-receipts.sh
      - name: Compare Windows native identity (test-only JNA, NTFS)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/test-windows-native-identity.sh
      - name: Phase 3c-1 RLC2 highwater ledger with real SQLite (synthetic)
        shell: bash
        run: bash scripts/test-watermark-ledger.sh
      - name: Assert no production RomRaider.jar is needed
        shell: bash
        run: test ! -f lib/RomRaider.jar

  windows-java8-x86-identity:
    name: Test-only native identity and bound READ (Zulu8 x86)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java8 bytecode and verify x64 baseline
        shell: bash
        run: |
          bash scripts/test-ingress-journal-prototype.sh
          bash scripts/test-windows-native-identity.sh
          bash scripts/test-product-v1-spool.sh
          bash scripts/test-watermark-ledger.sh
      - name: Install isolated Zulu8 32bit runtime
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: x86
      - name: Run native identity and bound read in actual 32bit JVM
        shell: bash
        env:
          ROMLOGGER_EXPECT_DATA_MODEL: '32'
        run: |
          java -version
          bash scripts/test-windows-native-identity.sh --run-only
          bash scripts/test-watermark-ledger.sh --run-only
          java -cp build/ingress-journal-prototype net.neristal.rrbridge.prototype.ingress.JournalIdentityComparisonTest
          java -cp build/ingress-journal-prototype net.neristal.rrbridge.prototype.ingress.SplitLockJournalPrototypeTest
          java -cp build/ingress-journal-prototype net.neristal.rrbridge.prototype.ingress.DurableWatermarkPrototypeTest
