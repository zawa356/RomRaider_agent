name: Legacy RRBridge TSV integrity CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'src/main/java/net/neristal/rrbridge/Stream.java'
      - 'src/test/poc-stubs/**'
      - 'src/test/poc-safety/**'
      - 'scripts/test-legacy-stream-safety.sh'
      - '.github/workflows/legacy-stream-safety-ci.yml'
  pull_request:
    paths:
      - 'src/main/java/net/neristal/rrbridge/Stream.java'
      - 'src/test/poc-stubs/**'
      - 'src/test/poc-safety/**'
      - 'scripts/test-legacy-stream-safety.sh'
      - '.github/workflows/legacy-stream-safety-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-tsv-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  legacy-writer:
    name: Legacy TSV writer / queue safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java8-compatible legacy Stream with isolated stubs
        shell: bash
        run: bash scripts/test-legacy-stream-safety.sh
      - name: Confirm production RomRaider.jar was not needed
        shell: bash
        run: test ! -f lib/RomRaider.jar
