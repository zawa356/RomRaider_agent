# VPS（Ubuntu 24.04 + Docker）向けの構成案。外部に出すのは Caddy の 80/443 だけ。
# 使い方: cp .env.example .env → 値を設定 → docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rrbridge
      POSTGRES_USER: rrbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrbridge -d rrbridge"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rrbridge:${POSTGRES_PASSWORD}@db:5432/rrbridge
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      ALLOWED_HOSTS: ${DOMAIN}
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
